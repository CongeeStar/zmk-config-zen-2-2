# Firmware files GitHub builds for Chris's Typeractive Corne (6-col, no nice!view).
# Left half = central (talks to the computer, runs ZMK Studio).
---
include:
  - board: nice_nano_v2
    shield: corne_left
    snippet: studio-rpc-usb-uart
  - board: nice_nano_v2
    shield: corne_right
  - board: nice_nano_v2
    shield: settings_reset
