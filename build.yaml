# Firmware files GitHub builds for this keyboard.
# Left half = "central" (talks to the computer, runs ZMK Studio).
---
include:
  - board: nice_nano_v2
    shield: lily58_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  - board: nice_nano_v2
    shield: lily58_right
  - board: nice_nano_v2
    shield: settings_reset
