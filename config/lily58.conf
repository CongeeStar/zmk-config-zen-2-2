# Stronger radio: steadier link between the halves and to the computer.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Save battery: deep sleep after 15 minutes idle. Any key press wakes it
# (the first key press after waking is used to wake up, not typed).
CONFIG_ZMK_SLEEP=y

# Windows compatibility: many Intel/Realtek laptop Bluetooth chips fail to
# connect or stop receiving keys with the faster 2M radio mode. Use 1M instead.
CONFIG_BT_CTLR_PHY_2M=n
