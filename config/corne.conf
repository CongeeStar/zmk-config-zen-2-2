# --- Connection stability -------------------------------------------------
# Maximum radio power: steadier link to laptops and between the halves.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# Use 1 Mbps Bluetooth instead of 2 Mbps. Fixes "can't connect" / "connected
# but not typing" on many Windows laptops (Intel/Realtek chips). Better range too.
CONFIG_BT_CTLR_PHY_2M=n

# --- Sleep ----------------------------------------------------------------
# Deep sleep after 60 minutes idle, so it stops trying to connect when you're
# away. Any key press wakes it (that first press isn't typed; give it ~3 s).
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# --- Typing feel (Typeractive default) ------------------------------------
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10

# --- ZMK Studio (live remapping, no reflashing) ----------------------------
CONFIG_ZMK_STUDIO=y
# No unlock key needed (same as Typeractive's default firmware).
CONFIG_ZMK_STUDIO_LOCKING=n
